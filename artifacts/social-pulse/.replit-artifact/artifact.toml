kind = "web"
previewPath = "/"
title = "Social Pulse"
description = "A responsive social platform centered on a personalized photo and video feed, user profiles, real follows and post interactions, and persistent private messaging."
version = "1.0.0"
id = "artifacts/social-pulse"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21106

[services.development]
run = "pnpm --filter @workspace/social-pulse run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/social-pulse", "run", "build" ]
serve = "static"
publicDir = "artifacts/social-pulse/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21106"
BASE_PATH = "/"
